---
name: Check plugins and skills
on:
  pull_request:
    paths: [.claude-plugin/**, .agents/plugins/**, skills/**, agents/**, hooks/**, mods/**, scripts/check-plugin-refs.mjs, scripts/validate-skills.mjs, scripts/sync-codex.mjs, tests/hooks/**]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-plugin-refs.mjs
      - run: node scripts/validate-skills.mjs
      - run: node scripts/sync-codex.mjs --check
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --with pytest python -m pytest tests/hooks -q
