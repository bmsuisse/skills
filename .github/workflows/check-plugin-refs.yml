---
name: Check plugin references
on:
  pull_request:
    paths: [.claude-plugin/**, skills/**, agents/**, hooks/**, mods/**, scripts/check-plugin-refs.mjs]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-plugin-refs.mjs
